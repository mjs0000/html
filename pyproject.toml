[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sosdiag"
version = "0.1.0"
description = "RHEL sosreport structure-diagnostic report generator"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-docx>=1.1",
  "docxtpl>=0.18",
  "pydantic>=2.7",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.22", "httpx>=0.27"]

[project.scripts]
sosdiag = "sosdiag.cli:app"
sosdiag-web = "sosdiag.web.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

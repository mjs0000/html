id: STG_MULTIPATH
category: Storage
section: "5.1"
title: Device Mapper Multipath
parser: multipath
policy_note: >-
  Multipath map이 실제로 존재하는 시스템만 평가한다. 단순히 device-mapper-multipath 패키지가 설치되어 있거나
  multipath.conf 파일이 존재하는 것만으로 적용 대상으로 보지 않는다. 실제 map과 path 상태를 기준으로
  서비스/구성 및 경로 이중화 상태를 확인한다.
applicability:
  applies_when:
    - at least one real multipath map is detected from multipath -ll or equivalent collected evidence
  not_applicable_when:
    - no multipath map is detected
  not_applicable_status: SKIPPED
evidence:
  primary:
    - sos_commands/multipath/multipath_-ll
    - sos_commands/multipath/multipathd_show_config
  supporting:
    - etc/multipath.conf
    - etc/multipath/*
    - sos_commands/block/lsblk_*
    - sos_commands/scsi/*
    - sos_commands/fc_host/*
normalized_fields:
  - map_name
  - wwid
  - vendor
  - product
  - size
  - path_group_count
  - total_path_count
  - usable_path_count
  - failed_path_count
  - path_states
  - dm_state
  - path_checker
  - path_grouping_policy
  - features
sub_checks:
  - id: multipath_map_state
    title: Multipath Map State
    assessment:
      pass_when:
        - multipath map is present and device-mapper state is active/usable
      warn_when:
        - multipath map is present but device-mapper state is failed, suspended, or otherwise unusable
      skipped_when:
        - multipath map state cannot be determined

  - id: path_redundancy
    title: Multipath Path Redundancy
    recommended:
      minimum_usable_paths: 2
    assessment:
      pass_when:
        - multipath map has at least two usable paths
        - every configured path expected to participate in the map is in a usable/up state
      warn_when:
        - multipath map has fewer than two usable paths
        - at least one configured path is failed, faulty, offline, down, or otherwise unusable
      skipped_when:
        - path count or one or more path states cannot be determined
    notes:
      - "Check every path shown for each multipath map. PASS requires redundancy and no failed path."
      - "A map may remain operational with one failed path, but this diagnostic still reports WARN because redundancy is degraded."

  - id: multipath_configuration
    title: Multipath Configuration
    assessment:
      pass_when:
        - effective multipath configuration can be resolved and the detected map is managed normally
      warn_when:
        - effective configuration contains an obvious inconsistency that prevents or degrades management of a detected map
      skipped_when:
        - effective configuration cannot be evaluated
    notes:
      - "Prefer 'multipathd show config' as effective configuration evidence when available."
      - "Do not require /etc/multipath.conf to exist when built-in/default configuration manages the device correctly."
      - "Do not invent vendor-specific parameter requirements unless a separate project rule is defined."
html:
  map_summary_columns:
    - hostname
    - map_name
    - wwid
    - vendor_product
    - total_paths
    - usable_paths
    - failed_paths
    - map_status
    - redundancy_status
    - config_status
  path_detail_columns:
    - hostname
    - map_name
    - path_device
    - hctl
    - path_group
    - path_state
    - dm_state
  notes:
    - "Render only hosts where at least one real multipath map is detected."
    - "If a host has multiple multipath maps, render one summary row per map."
    - "Display every path so any failed/down path is visible."
overall_status:
  mode: derived_from_sub_checks
  rule: >-
    If an overall 5.1 status is required, use the worse visible sub-check status while preserving Map State,
    Path Redundancy, and Configuration statuses separately.
missing_data:
  status: SKIPPED
  include_in_report: false

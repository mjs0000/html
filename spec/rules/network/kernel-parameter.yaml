id: NET_KERNEL_PARAM
category: Network
section: "4.2"
title: 네트워크 커널 파라미터
parser: sysctl
policy_note: >-
  프로젝트 Scope에 정의된 네트워크 성능 관련 커널 파라미터를 Hostname별로 비교한다.
  각 파라미터는 독립 sub-check로 평가하고, 권장값 미충족 시 WARN 처리한다.
evidence:
  primary:
    - sos_commands/kernel/sysctl_-a
  supporting:
    - etc/sysctl.conf
    - etc/sysctl.d/*
parameters:
  - name: net.core.netdev_max_backlog
    recommended:
      operator: ge
      value: 2000
  - name: net.ipv4.tcp_rmem
    recommended:
      operator: eq
      value: [4096, 87380, 16777216]
  - name: net.ipv4.tcp_wmem
    recommended:
      operator: eq
      value: [4096, 16384, 16777216]
  - name: net.core.rmem_max
    recommended:
      operator: ge
      value: 16777216
  - name: net.core.wmem_max
    recommended:
      operator: ge
      value: 16777216
  - name: vm.min_free_kbytes
    recommended:
      operator: ge
      value: 1024000
  - name: net.core.netdev_budget
    recommended:
      operator: eq
      value: 300
assessment:
  pass_when:
    - all applicable network kernel parameters meet the project recommendation
  warn_when:
    - one or more network kernel parameters do not meet the project recommendation
  skipped_when:
    - required sysctl evidence is unavailable
  notes:
    - "Evaluate runtime sysctl values from sysctl -a first."
    - "Use /etc/sysctl.conf and /etc/sysctl.d/* as supporting evidence for persistence, but do not override the runtime value."
    - "tcp_rmem and tcp_wmem are exact three-value comparisons."
html:
  parameter_matrix:
    orientation: horizontal
    row_key: hostname
    columns:
      - net.core.netdev_max_backlog
      - net.ipv4.tcp_rmem
      - net.ipv4.tcp_wmem
      - net.core.rmem_max
      - net.core.wmem_max
      - vm.min_free_kbytes
      - net.core.netdev_budget
      - status
    show_recommended_row: true
    notes:
      - "Display one host per row and one parameter per column."
      - "Highlight only parameters that fail the project recommendation."
missing_data:
  status: SKIPPED
  include_in_report: false

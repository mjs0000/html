id: SYS_FIREWALLD
category: System
section: "3.7"
title: Firewalld
parser: firewalld
recommended_state: disabled
evidence:
  primary:
    - systemctl_list-unit-files
    - systemctl_list-units
  supporting:
    - firewall-cmd_--list-all-zones
    - etc/firewalld/*
display:
  always_show:
    - enabled
    - active
  when_active_show:
    - default_zone
    - zones
    - services
    - ports
    - rich_rules
assessment:
  pass_when:
    - firewalld is disabled and inactive
  warn_when:
    - firewalld is enabled or active
  skipped_when:
    - firewalld state cannot be determined from usable evidence
  notes:
    - installed-but-disabled/inactive is considered PASS
    - when enabled or active, preserve and display the current zone/service/port/rich-rule configuration for review
missing_data:
  status: SKIPPED
  include_in_report: false
  reason: Firewalld state could not be determined from usable evidence.
recommendation:
  - Recommended state for this diagnostic policy is disabled.
  - When Firewalld is enabled or active, preserve and display detected zones, services, ports, and rich rules rather than hiding the current configuration.
  - Do not use A/B/C grades; report PASS, WARN, FAIL, or SKIPPED only.

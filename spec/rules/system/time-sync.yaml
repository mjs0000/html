id: SYS_TIME_SYNC
category: System
section: "3.8"
title: 시간 동기화
parser: chrony
recommended_state:
  service: active
  configured_sources_minimum: 4
policy_note: >-
  시각 동기화 서버를 최소 4개 이상 참조하도록 Time Source를 구성할 것을 권장한다.
  2개 구성은 어느 source가 더 정확한지 판별할 비교 reference가 부족하고,
  3개 구성은 falseticker 판별의 최소 수량에는 도달하지만 하나가 제외되면 redundancy가 남지 않는다.
  4개 구성은 falseticker 판별과 redundancy를 함께 고려할 수 있다.
evidence:
  primary:
    - sos_commands/chrony/chronyc_sources_-v
    - sos_commands/chrony/chronyc_tracking
    - etc/chrony.conf
  supporting:
    - sos_commands/chrony/chronyc_sourcestats
    - sos_commands/date/timedatectl
normalized_fields:
  - chronyd_active
  - configured_source_count
  - source_states
  - stratum
  - system_time_offset
assessment:
  pass_when:
    - chronyd is active
    - configured time sources are 4 or more
  warn_when:
    - chronyd is inactive
    - configured time sources are fewer than 4
  skipped_when:
    - chrony service state or configured source count cannot be determined from usable evidence
  source_count_rationale:
    two_sources: "WARN: comparison reference is insufficient to reliably determine which source is preferable."
    three_sources: "WARN: falseticker determination is possible, but after excluding one source only two remain and redundancy is insufficient."
    four_or_more_sources: "PASS condition for source-count policy: supports falseticker handling and operational redundancy."
html:
  primary_key: hostname
  columns:
    - hostname
    - chrony_state
    - configured_source_count
    - status
  notes:
    - "Selected source is not part of the 3.8 status decision or customer-facing summary."
missing_data:
  status: SKIPPED
  include_in_report: false

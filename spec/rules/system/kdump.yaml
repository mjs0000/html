id: SYS_KDUMP
category: System
section: "3.9"
title: 덤프 수집(Kdump)
parser: kdump
policy_note: >-
  3.9는 Kdump 자체 상태와 장애 덤프 관련 커널 파라미터를 별도 sub-check로 평가한다.
sub_checks:
  - id: kdump_state
    title: Kdump State
    recommended_state:
      kdump_enabled: true
      crashkernel_reserved: true
      kdumpctl_showmem_available: true
    evidence:
      primary:
        - proc/cmdline
        - sys/kernel/kexec_crash_size
        - etc/kdump.conf
        - systemctl_list-unit-files
        - systemctl_list-units
        - sos_commands/kdump/kdumpctl_showmem
      supporting:
        - sos_commands/kdump/kdumpctl_status
        - var/crash/*
    normalized_fields:
      - kdump_enabled
      - kdump_active
      - crashkernel_parameter
      - kexec_crash_size
      - kdumpctl_showmem
      - dump_target
    assessment:
      pass_when:
        - kdump service is enabled or otherwise confirmed usable by collected evidence
        - crash kernel memory reservation is present
      warn_when:
        - kdump is disabled or inactive
        - crash kernel memory reservation is missing
      skipped_when:
        - kdump state and crash memory reservation cannot be determined from usable evidence
    notes:
      - kdumpctl showmem is required evidence when present in the sosreport and should be displayed verbatim or normalized into a reserved-memory value.

  - id: kernel_parameters
    title: Kdump-related Kernel Parameters
    evidence:
      primary:
        - sos_commands/kernel/sysctl_-a
        - proc/sys/kernel/*
    parameters:
      - name: kernel.nmi_watchdog
        recommended: 0
      - name: kernel.panic_on_io_nmi
        recommended: 1
      - name: kernel.panic_on_unrecovered_nmi
        recommended: 1
      - name: kernel.unknown_nmi_panic
        recommended: 1
      - name: kernel.sysrq
        recommended: 1
      - name: kernel.hung_task_panic
        recommended: null
        display_only: true
      - name: kernel.panic_on_oops
        recommended: null
        display_only: true
      - name: kernel.panic
        recommended: null
        display_only: true
      - name: kernel.softlockup_panic
        recommended: null
        display_only: true
    assessment:
      pass_when:
        - all parameters with explicit recommended values match the project recommendation
      warn_when:
        - one or more parameters with explicit recommended values differ from the project recommendation
      skipped_when:
        - none of the required kernel parameter values can be determined from usable evidence
      notes:
        - Parameters with recommended=null are informational only and must not independently change PASS/WARN status.

html:
  kdump_summary_columns:
    - hostname
    - kdump_state
    - crashkernel
    - kdumpctl_showmem
    - kdump_status
  parameter_matrix:
    orientation: horizontal
    row_key: hostname
    columns:
      - kernel.hung_task_panic
      - kernel.nmi_watchdog
      - kernel.panic
      - kernel.panic_on_io_nmi
      - kernel.panic_on_oops
      - kernel.panic_on_unrecovered_nmi
      - kernel.softlockup_panic
      - kernel.sysrq
      - kernel.unknown_nmi_panic
      - kernel_parameter_status
    show_recommended_row: true
    notes:
      - "Render kernel parameters in a wide matrix similar to the supplied reference image: one host per row and one kernel parameter per column."
      - "Parameters without a project recommendation are displayed for comparison only."
overall_status:
  mode: derived_from_sub_checks
  rule: >-
    Keep kdump_state and kernel_parameters as separate visible statuses. If an overall 3.9 status is required by a parent summary, use the worse of the two statuses without hiding either sub-check result.
missing_data:
  status: SKIPPED
  include_in_report: false

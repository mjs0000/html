id: SYS_APP_COREDUMP
category: System
section: "3.13"
title: Application Core Dump
parser: coredump
policy_note: >-
  Application Segmentation Fault 등 비정상 종료 시 Core Dump를 수집할 수 있도록 설정 여부를 확인한다.
  3.13은 Core Limit, systemd DefaultLimitCORE, Core Dump Retention을 각각 별도 sub-check로 평가한다.
evidence:
  primary:
    - sos_commands/process/ulimit_-aH
    - sos_commands/process/ulimit_-aS
    - etc/security/limits.conf
    - etc/security/limits.d/*
    - etc/systemd/system.conf
    - usr/lib/tmpfiles.d/systemd.conf
    - etc/tmpfiles.d/*
  supporting:
    - proc/sys/kernel/core_pattern
    - etc/systemd/coredump.conf
    - usr/lib/systemd/coredump.conf.d/*
    - usr/lib/sysctl.d/50-coredump.conf
    - sos_commands/coredump/coredumpctl_list_--reverse
normalized_fields:
  - hard_core_limit
  - soft_core_limit
  - limits_conf_soft_unlimited
  - limits_conf_hard_unlimited
  - default_limit_core
  - retention
sub_checks:
  - id: core_limit
    title: Core File Size Limit
    decision_logic:
      - "Read 'ulimit -aH | grep core' and 'ulimit -aS | grep core' when available."
      - "If both hard and soft core limits are unlimited, PASS."
      - "If either hard or soft ulimit value is not unlimited, inspect /etc/security/limits.conf and /etc/security/limits.d/* as fallback configuration evidence."
      - "When fallback is needed, PASS only if both '* soft core unlimited' and '* hard core unlimited' are configured."
      - "When fallback is needed and either required limits setting is absent, WARN."
    recommended:
      soft_core: unlimited
      hard_core: unlimited
    assessment:
      pass_when:
        - both ulimit soft and hard core values are unlimited
        - or, when ulimit is not unlimited, both wildcard soft and hard unlimited settings are configured in limits.conf or limits.d
      warn_when:
        - ulimit is not unlimited and one or both required wildcard unlimited settings are not configured
      skipped_when:
        - neither ulimit evidence nor usable limits.conf/limits.d evidence is available

  - id: default_limit_core
    title: systemd DefaultLimitCORE
    recommended:
      value: infinity
      source: /etc/systemd/system.conf
    assessment:
      pass_when:
        - /etc/systemd/system.conf explicitly configures DefaultLimitCORE=infinity, case-insensitive
      warn_when:
        - DefaultLimitCORE=infinity is absent, commented out, or configured to another value
      skipped_when:
        - /etc/systemd/system.conf cannot be evaluated
    notes:
      - "Evaluate the explicit project setting in /etc/systemd/system.conf; do not infer PASS only from a compiled or inherited systemd default."

  - id: retention
    title: Core Dump Retention
    recommended:
      avoid_automatic_3d_cleanup: true
    assessment:
      pass_when:
        - a local tmpfiles override prevents automatic removal of /var/lib/systemd/coredump entries according to the project retention policy
      warn_when:
        - only the default 3-day tmpfiles cleanup policy applies and no override/exclusion is configured
      skipped_when:
        - tmpfiles retention configuration cannot be determined
    notes:
      - "The default 3-day cleanup is treated as a retention risk; preserve the existing 3.13-3 policy."
html:
  summary_columns:
    - hostname
    - hard_ulimit_core
    - soft_ulimit_core
    - limits_soft_unlimited
    - limits_hard_unlimited
    - default_limit_core
    - retention
    - core_limit_status
    - default_limit_core_status
    - retention_status
  notes:
    - "If ulimit is already unlimited, limits.conf fallback fields may be displayed as '-' because they do not affect the Core Limit status."
    - "Keep all three sub-check statuses visible separately."
overall_status:
  mode: derived_from_sub_checks
  rule: >-
    If an overall 3.13 status is required, use the worse visible sub-check status while preserving each sub-check result.
missing_data:
  status: SKIPPED
  include_in_report: false

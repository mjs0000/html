id: SYS_SELINUX
category: System
section: "3.6"
title: SELINUX
parser: selinux
recommended_state: disabled
primary_evidence:
  - runtime_mode_from_getenforce
  - configured_mode_from_etc_selinux_config
supporting_evidence:
  - sestatus
  - proc_cmdline_selinux_0
assessment:
  primary_logic:
    - 'Use getenforce runtime state and /etc/selinux/config configured state as the main decision evidence for every RHEL version.'
    - 'If both runtime and configured state are Disabled, status is PASS.'
    - 'If either primary state is Enforcing or Permissive, status is WARN.'
    - 'If runtime and configured states disagree, preserve the mismatch as a finding.'
    - 'If only one of the two primary sources is usable, evaluate from the available primary source but record the missing source as a finding.'
    - 'If neither primary source is usable, mark SKIPPED.'
  proc_cmdline_logic:
    - '/proc/cmdline is additional supporting evidence, not the primary decision source.'
    - 'Record whether the exact selinux=0 token exists when /proc/cmdline is available.'
    - 'If runtime is Disabled and /etc/selinux/config is disabled, absence of selinux=0 is considered normal and must not add WARN or review findings.'
    - 'Missing /proc/cmdline alone must not cause SKIPPED when getenforce and/or /etc/selinux/config is usable.'
    - 'Use /proc/cmdline only as supporting context or when it conflicts with an active runtime state.'
display:
  always_show:
    - runtime_mode
    - configured_mode
    - runtime_config_mismatch
  additional_show:
    - rhel_major
    - kernel_selinux_disabled
    - kernel_cmdline
missing_data:
  status: SKIPPED
  include_in_report: false
  reason: Neither getenforce nor /etc/selinux/config provided usable SELinux state evidence.
recommendation:
  - Keep getenforce and /etc/selinux/config visible as the main report evidence.
  - Show /proc/cmdline as additional evidence when available.
  - Do not use A/B/C grades; report PASS, WARN, FAIL, or SKIPPED only.

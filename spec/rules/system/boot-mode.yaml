id: SYS_BOOT_MODE
category: System
section: "3.3"
title: Boot Mode
parser: boot_mode
assessment:
  UEFI:
    status: PASS
    message: UEFI environment is in use.
  BIOS:
    status: WARN
    message: Legacy BIOS environment is in use.
missing_data:
  status: SKIPPED
  include_in_report: false
  reason: Boot mode could not be determined from required sosreport evidence.
recommendation:
  - New installations should use UEFI.
  - Existing Legacy BIOS systems should not be converted solely for this diagnostic item.
evidence_required:
  - path: sys/firmware/efi
    check: directory_exists
    meaning:
      exists: UEFI
      absent: BIOS
supporting_evidence:
  - sos_commands/boot/efibootmgr_-v
  - sos_commands/boot/ls_-lanR_.sys.firmware
  - sos_commands/boot/ls_-alZR_.sys.firmware
  - sos_commands/boot/mokutil_--sb-state
notes:
  - '/sys/firmware/efi directory presence is the primary boot-mode discriminator.'
  - 'efibootmgr and firmware listings are supporting evidence, not the primary decision source.'

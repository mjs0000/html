id: SYS_PACKAGE_UPDATE
category: System
section: "3.5"
title: 주요 패키지 업데이트
parser: packages
render:
  html: true
  docx: true
  json: true
package_groups:
  kernel:
    include_names:
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-core
excluded_package_groups:
  - openssl
  - openssh
normalized_fields:
  - package_group
  - package_name
  - epoch
  - version
  - release
  - arch
  - installed_nevra
  - running_kernel
  - advisory_status
  - external_reference_source
  - external_reference_url
  - external_reference_version
  - external_reference_checked_at
policy:
  assessment_source: external_authoritative_reference
  external_reference_required: true
  accepted_reference_types:
    - Red Hat security advisory
    - Red Hat package errata/advisory metadata
    - Red Hat supported package repository metadata
  collected_updateinfo_may_support_assessment: true
  absence_of_updateinfo_is_failure: false
  do_not_assess_other_packages: true
  comparison_scope:
    - rhel_major_version
    - architecture
    - kernel_package_family
  excluded_scope:
    - minor_release
    - EUS
    - ELC
    - support_stream
  unknown_reference:
    status: SKIPPED
    include_in_report: false
assessment:
  pass_when:
    - installed kernel package level is at or above the applicable authoritative Red Hat reference level selected for the same RHEL major version and architecture
  warn_when:
    - installed kernel package level is older than the applicable authoritative Red Hat reference level selected for the same RHEL major version and architecture
    - a newer kernel package is installed but the running kernel is older; retain a reboot-required finding
  skipped_when:
    - no trustworthy external Red Hat kernel comparison reference is available for the RHEL major version and architecture
  fail_when:
    - only when a future project rule explicitly defines a kernel state as FAIL; do not infer FAIL merely from a newer available kernel
html:
  primary_key: hostname
  columns:
    - hostname
    - rhel_major_version
    - running_kernel
    - installed_kernel
    - reference_version
    - reference
    - status
  reference:
    label_field: external_reference_source
    url_field: external_reference_url
    render_as_link_when_url_present: true
    open_in_new_tab: true
notes:
  - Only the kernel package family is assessed in 3.5.
  - OpenSSL and OpenSSH are excluded from this diagnostic.
  - Minor release, EUS, ELC, and other support-stream distinctions are intentionally excluded from the comparison policy.
  - Installed version strings alone must never determine PASS/WARN/FAIL; use an external authoritative Red Hat kernel reference for the same RHEL major version and architecture.
  - Preserve both running kernel and newest installed kernel package levels; do not assume the newest installed kernel is currently booted.

network:
  bonding:
    candidates:
      - proc/*/net/bonding/*
      - proc/net/bonding/*
      - etc/NetworkManager/system-connections/bond*.nmconnection
      - sos_commands/networkmanager/nmcli_con_show_id_bond*
      - sos_commands/networkmanager/nmcli_con
      - sos_commands/networking/ip_-s_-d_link
      - sos_commands/networking/ip_-d_link

  links:
    candidates:
      - sos_commands/networkmanager/nmcli_general_status
      - sos_commands/networkmanager/nmcli_dev
      - sos_commands/networkmanager/nmcli_con_show_--active
      - sos_commands/networkmanager/journalctl_--no-pager_--unit_NetworkManager
      - etc/NetworkManager/NetworkManager.conf
      - sos_commands/networking/ip_-s_-d_link
      - sos_commands/networking/ip_-s_link
      - sos_commands/networking/ip_-d_address
      - sos_commands/networking/ip_-o_addr
      - sos_commands/networking/ethtool_*

  kernel_parameters:
    applicability:
      requires_connected_10g_or_faster_nic: true
      minimum_speed_mbps: 10000
      require_physical_nic: true
      require_link_detected: true
      require_carrier_up: true
      speed_sources:
        - sos_commands/networking/ethtool_*
      link_sources:
        - sos_commands/networking/ethtool_*
        - sos_commands/networking/ip_-s_-d_link
        - sos_commands/networking/ip_-s_link
        - sos_commands/networkmanager/nmcli_dev
      applicability_logic:
        all:
          - physical_nic == true
          - speed_mbps >= 10000
          - link_detected == true
          - carrier_up == true
    candidates:
      - sos_commands/kernel/sysctl_-a
      - proc/sys/net/*
    softnet_candidates:
      - proc/*/net/softnet_stat
      - proc/net/softnet_stat
    counter_candidates:
      - sos_commands/networking/ethtool_-S_*
      - sos_commands/networking/ip_-s_-d_link
      - sos_commands/networking/ip_-s_link
    normalized_fields:
      - physical_nic
      - interface_name
      - nic_speed_mbps
      - link_detected
      - carrier_up
      - operational_state
      - bond_master
      - netdev_max_backlog
      - netdev_budget
      - tcp_rmem
      - tcp_wmem
      - rmem_max
      - wmem_max
      - min_free_kbytes
      - softnet_drops
      - softnet_time_squeeze
    notes:
      - 'This diagnostic is applicable only when at least one physical NIC has an active 10Gbps-or-faster link.'
      - 'NIC capability/presence alone is insufficient. The parser must confirm actual speed and an active link/carrier from collected runtime evidence.'
      - 'A 10Gbps-or-faster NIC that is installed but disconnected, Link detected: no, NO-CARRIER, or DOWN does not make this diagnostic applicable.'
      - 'Bond slave interfaces may satisfy applicability when their physical link is up; evaluate physical slave links rather than the logical bond interface speed alone.'
      - 'If no connected 10Gbps-or-faster physical NIC is detected, mark the diagnostic internally SKIPPED and do not render it.'

  netstate:
    candidates:
      - sos_commands/networkmanager/nmcli_general_status
      - sos_commands/networkmanager/nmcli_dev
      - sos_commands/networkmanager/nmcli_con_show_--active
      - sos_commands/networkmanager/journalctl_--no-pager_--unit_NetworkManager
      - etc/NetworkManager/NetworkManager.conf
      - sos_commands/networking/ip_-s_-d_link
      - sos_commands/networking/ip_-s_link
      - sos_commands/networking/ip_-d_address
      - sos_commands/networking/ip_-o_addr
      - sos_commands/networking/ethtool_*

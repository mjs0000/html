system:
  hostname:
    candidates:
      - sos_commands/host/hostname
      - hostname

  os_release:
    candidates:
      - etc/redhat-release
      - etc/os-release
      - sos_commands/kernel/uname_-a

  hardware:
    candidates:
      - sos_commands/hardware/dmidecode
      - sos_commands/processor/lscpu
      - sos_commands/pci/lspci_-nnvv

  boot_mode:
    candidates:
      - sys/firmware/efi
      - sos_commands/boot/efibootmgr_-v
      - sos_commands/boot/ls_-lanR_.sys.firmware
      - sos_commands/boot/ls_-alZR_.sys.firmware
    primary_detection:
      uefi_when_directory_exists: sys/firmware/efi
      bios_when_directory_absent: sys/firmware/efi
    secure_boot_candidates:
      - sos_commands/boot/mokutil_--sb-state
    notes:
      - 'Primary boot-mode check: if /sys/firmware/efi exists, classify as UEFI; if absent, classify as legacy BIOS.'
      - 'efibootmgr and firmware listings are supporting evidence and help validate the primary result.'

  filesystem:
    candidates:
      - sos_commands/filesys/findmnt
      - sos_commands/block/lsblk_-f_-a_-l
      - sos_commands/filesys/df_-ali_-x_autofs
      - sos_commands/filesys/df_-aliT_-x_autofs
      - sos_commands/filesys/df_-al_-x_autofs
      - etc/fstab
    lvm_candidates:
      - sos_commands/lvm2/pvs*
      - sos_commands/lvm2/vgs*
      - sos_commands/lvm2/lvs*
    swap_candidates:
      - proc/swaps
      - sos_commands/memory/swapon_--show*

  packages:
    candidates:
      - installed-rpms
      - sos_commands/dnf/dnf_list_installed
      - sos_commands/dnf/dnf_--assumeno_list_installed_dnf
    updateinfo_optional:
      - sos_commands/dnf/dnf_updateinfo*
      - sos_commands/yum/yum_updateinfo*
    external_reference_required: true
    external_reference_purpose:
      - latest_supported_version
      - security_advisory_status
      - lifecycle_or_errata_context
    package_allowlist:
      - kernel
      - openssl
      - openssh
    package_match_notes:
      - 'kernel includes installed kernel package variants needed to identify the running/installed kernel level.'
      - 'openssl package family should be normalized to the primary OpenSSL runtime package/version.'
      - 'openssh package family should retain client/server package versions where present, while reporting the OpenSSH product version as one check group.'
    normalized_fields:
      - package_group
      - package_name
      - epoch
      - version
      - release
      - arch
      - installed_nevra
      - running_kernel
      - update_reference_status
      - external_reference_source
      - external_reference_version
      - external_reference_checked_at
    notes:
      - 'Only kernel, openssl and openssh are in scope for SYS_PACKAGE_UPDATE.'
      - 'Do not render unrelated installed packages as package-update findings.'
      - 'The installed version alone is not sufficient for a final decision; compare it with an external authoritative reference before evaluating status.'

  selinux:
    version_candidates:
      - etc/redhat-release
      - etc/os-release
    runtime_candidates:
      - sos_commands/selinux/getenforce
      - sos_commands/selinux/sestatus
    config_candidates:
      - etc/selinux/config
    kernel_cmdline_candidates:
      - proc/cmdline
    recommended_state: disabled
    rhel_9_plus:
      required_evidence:
        - proc/cmdline
      required_kernel_parameter: selinux=0
    normalized_fields:
      - rhel_major
      - runtime_mode
      - configured_mode
      - runtime_config_mismatch
      - kernel_cmdline
      - kernel_selinux_disabled
    display_policy:
      primary_key: hostname
      always_display_detected_state: true
      always_display_kernel_cmdline_for_rhel_9_plus: true
      recommended_label: disabled
    notes:
      - 'A/B/C grades are not used. SELinux results use PASS/WARN/FAIL/SKIPPED.'
      - 'For RHEL 9 and later, /proc/cmdline must be collected and the exact selinux=0 token checked.'
      - 'For RHEL 9 and later, /etc/selinux/config alone must not produce PASS when /proc/cmdline is missing.'
      - 'Runtime and persistent configuration remain visible as supporting evidence.'

  firewalld:
    candidates:
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units
      - sos_commands/firewalld/firewall-cmd_--list-all-zones
      - etc/firewalld/*
    recommended_state: disabled
    normalized_fields:
      - installed
      - enabled
      - active
      - default_zone
      - zones
      - services
      - ports
      - rich_rules
    display_policy:
      always_display_detected_state: true
      recommended_label: disabled
    notes:
      - 'Disabled is the RockPLACE recommended state for this diagnostic.'
      - 'When enabled/active, display the actual service state and collected zone/service/port configuration.'

  time_sync:
    candidates:
      - sos_commands/chrony/chronyc_-n_sources
      - sos_commands/chrony/chronyc_tracking
      - sos_commands/chrony/chronyc_sourcestats
      - etc/chrony.conf
      - sos_commands/systemd/timedatectl

  kdump:
    candidates:
      - proc/cmdline
      - sys/kernel/kexec_crash_size
      - etc/kdump.conf
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units
      - sos_commands/kernel/sysctl_-a
    optional_candidates:
      - sos_commands/kdump/kdumpctl_status
      - sos_commands/kdump/kdumpctl_estimate
      - var/crash/*

  error_log:
    candidates:
      - var/log/messages
      - var/log/messages-*
      - sos_commands/kernel/dmesg
      - sos_commands/kernel/dmesg_*
      - sos_commands/logs/dmesg
      - sos_commands/logs/dmesg_*
      - sos_commands/logs/journalctl*
    search_profiles:
      storage_io:
        patterns:
          - 'blk_update_request: I/O error'
          - 'rejecting I/O to offline device'
          - 'killing request'
          - 'hostbyte=DID_NO_CONNECT'
          - 'mark as failed'
          - 'remaining active paths'
          - 'parity'
          - 'Abort command issued'
          - 'Hardware Error'
      generic_severity:
        word_patterns:
          - error
          - emerg
          - alert
          - aleart
          - crit
          - err
          - warn
          - fail
    normalized_fields:
      - source
      - timestamp
      - category
      - severity
      - component
      - matched_pattern
      - message
      - count
    notes:
      - 'Equivalent intent to the scope egrep keyword scan; implement in Python rather than shelling out.'
      - 'Generic words such as error/warn/fail require contextual filtering to reduce false positives.'
      - 'Finding a keyword is evidence for conditional assessment, not an automatic FAIL.'

  kernel_parameters:
    candidates:
      - sos_commands/kernel/sysctl_-a
      - proc/sys/*

  services:
    candidates:
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units
      - etc/systemd/system/*.wants/*
    default_target_candidates:
      - etc/systemd/system/default.target
    default_target_check:
      type: symlink_target
      expected_output_field: default_target_link
    service_policy:
      - name: iscsi.service
        description: iscsi 장치를 검색하거나 로그인하는 서비스
        recommendation: iscsi 미 사용시 Disable
      - name: iscsi-onboot.service
        description: iscsi 장치를 검색하거나 로그인하는 서비스
        recommendation: iscsi 미 사용시 Disable
      - name: libstoragemgmt.service
        description: 다양한 스토리지 관리를 위한 개발 API 응용프로그램
        recommendation: 개발 API를 사용하여 스토리지 어레이 미 관리시 Disable
      - name: nis-domainname.service
        description: /etc/sysconfig/network에서 NIS DomainName을 읽거나 설정하는 서비스
        recommendation: Disable
      - name: nvmefc-boot-connections.service
        description: SAN용 NVMe 장치를 검색 및 마운트 시도
        recommendation: SAN용 NVMe 미 사용시 Disable
      - name: ostree-remount.service
        description: OSTree Remount OS / Bind Mounts
        recommendation: 재부팅 시 간혹 emergency mode로 빠지는 문제로 Disable
      - name: qemu-guest-agent.service
        description: guest operating system using libvirt
        recommendation: KVM 기반 VM이 아닐 시 Disable
      - name: libvirtd.service
        description: KVM 및 가상화 환경을 사용하는 서비스
        recommendation: KVM, 가상화 환경 미사용시 Disable
      - name: ksm.service
        description: 가상화 환경에서 메모리 밀도를 향상하기 위한 서비스
        recommendation: KVM, 가상화 환경 미사용시 Disable
      - name: ksmtuned.service
        description: 가상화 환경에서 메모리 밀도를 향상하기 위한 서비스
        recommendation: KVM, 가상화 환경 미사용시 Disable
      - name: spice-vdagentd.service
        description: KVM 및 가상화에서 spice 원격을 제공하는 서비스
        recommendation: KVM, 가상화 환경에서 spice client 미사용시 Disable
      - name: bluetooth.service
        description: Bluetooth 기능을 제공하는 서비스
        recommendation: Disable
      - name: cups.service
        description: 프린트 기능을 제공하는 서비스
        recommendation: Disable
      - name: atd.service
        description: crond과 같이 스케줄링을 제공하는 서비스
        recommendation: Disable
      - name: wpa_supplicant.service
        description: WPA, WPA2, WPA3 등 무선 인증방식을 지원하는 서비스
        recommendation: Disable
      - name: avahi-daemon.service
        description: 로컬 네트워크에 연결된 장치가 기능과 함께 IP 주소를 브로드캐스트하는 서비스
        recommendation: Disable
      - name: mdmonitor.service
        description: software RAID 모니터링 및 매니지먼트 서비스
        recommendation: Disable
      - name: ModemManager.service
        description: modem을 관리하는 서비스
        recommendation: Disable
      - name: rhsmcertd.service
        description: Red Hat 제품에 대한 Subscription을 발행하여 컨텐츠 업데이트 및 지원을 제공하는 서비스
        recommendation: Disable
      - name: rtkit-daemon.service
        description: 요청 시 사용자 프로세스/스레드의 스케줄링 정책을 SCHED_RR로 변경하는 D-Bus 시스템 서비스
        recommendation: Disable
      - name: selinux-autorelabel-mark.service
        description: SELinux의 Re-Label 확인 서비스
        recommendation: Disable
      - name: vdo.service
        description: VDO 볼륨에서 압축 및 중복 제거를 제공하는 서비스
        recommendation: VDO 미 사용시 Disable
    notes:
      - 'Inspect both enablement and runtime state for each listed service.'
      - 'Conditional recommendations require workload/context checks before WARN/FAIL; service presence alone is not a finding.'
      - 'Also record the symbolic-link target of /etc/systemd/system/default.target to identify the configured default boot target.'

  app_coredump:
    candidates:
      - etc/security/limits.conf
      - etc/security/limits.d/*
      - etc/systemd/coredump.conf
      - etc/systemd/coredump.conf.d/*
      - etc/systemd/system.conf
      - usr/lib/sysctl.d/50-coredump.conf
      - proc/sys/kernel/core_pattern
      - usr/lib/tmpfiles.d/systemd.conf
      - etc/tmpfiles.d/*
    normalized_fields:
      - soft_core_limit
      - hard_core_limit
      - default_limit_core
      - core_pattern
      - coredump_storage
      - coredump_directory
      - tmpfiles_retention
      - tmpfiles_exclusion
    expected_checks:
      - path: etc/systemd/system.conf
        key: DefaultLimitCORE
        recommended: infinity
      - path: usr/lib/tmpfiles.d/systemd.conf
        key: /var/lib/systemd/coredump retention
        recommended_review: '3d default; consider exclusion or longer retention such as 15d according to policy'

  logrotate_sysstat:
    logrotate_candidates:
      - etc/logrotate.conf
      - etc/logrotate.d/*
      - sos_commands/logrotate/logrotate_debug
      - var/lib/logrotate/logrotate.status
    sysstat_candidates:
      - usr/lib/systemd/system/sysstat-collect.timer
      - etc/systemd/system/sysstat.service.wants/sysstat-collect.timer
      - etc/systemd/system/sysstat-collect.timer.d/*
      - etc/cron.d/sysstat
      - sos_commands/systemd/systemctl_list-timers_--all
      - installed-rpms
    normalized_fields:
      - logrotate_frequency
      - logrotate_rotate_count
      - sysstat_installed
      - sysstat_timer_present
      - sysstat_timer_oncalendar
      - sysstat_timer_enabled
    expected_checks:
      - path: usr/lib/systemd/system/sysstat-collect.timer
        key: OnCalendar
        recommended: '*:00/1'
        scope_default_example: '*:00/10'

  tuned:
    candidates:
      - sos_commands/tuned/tuned-adm_active
      - sos_commands/tuned/tuned-adm_recommend
      - sos_commands/tuned/tuned-adm_verify
      - etc/tuned/active_profile
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units

  irqbalance:
    candidates:
      - etc/sysconfig/irqbalance
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units

  timers:
    candidates:
      - sos_commands/systemd/systemctl_list-timers_--all
      - usr/lib/systemd/system/*.timer
      - etc/systemd/system/timers.target.wants/*
      - usr/lib/systemd/system/sysstat-collect.timer
    specific_timer_candidates:
      sysstat_collect:
        - usr/lib/systemd/system/sysstat-collect.timer
        - etc/systemd/system/sysstat.service.wants/sysstat-collect.timer
        - etc/systemd/system/sysstat-collect.timer.d/*
    applicability:
      source: sos_commands/systemd/systemctl_list-timers_--all
      conditional_after_inventory: true
    normalized_fields:
      - timer_name
      - next_run
      - last_run
      - active
      - enabled
      - conditionally_relevant
      - on_calendar
    notes:
      - 'First inventory list-timers, then evaluate only timer units that have an explicit diagnostic rule.'
      - 'dnf-makecache.timer is a known scope rule candidate; other timers are not automatically findings.'
      - '/usr/lib/systemd/system/sysstat-collect.timer is an explicit supporting source and its OnCalendar value should be retained when present.'

  other_settings:
    rsyslog:
      candidates:
        - etc/rsyslog.d/0-ignore-systemd-session-slice.conf
      required_path: etc/rsyslog.d/0-ignore-systemd-session-slice.conf
      expected_content_lines:
        - 'if $programname == "systemd" and ($msg contains "User Manager for UID" or $msg contains "user@" or $msg contains "run-user-" or $msg contains "user-runtime-dir@" or $msg contains "slice User Slice of UID" or $msg contains "User runtime directory /run/user/") then stop'
        - 'if ($programname == "systemd" and $procid != "1") and ($msg contains "slice User Application Slice" or $msg contains "Queued start job for default target Main User Target" or $msg contains "Mark boot as successful after the user" or $msg contains "Daily Cleanup of User''s Temporary Directories" or $msg contains "D-Bus User Message Bus Socket" or $msg contains "Create User''s Volatile Files and Directories" or $msg contains "Exit the Session" or $msg contains "Reached target" or $msg contains "Stopped target" or $msg contains "Startup finished in") then stop'
      remediation:
        - 'Create /etc/rsyslog.d/0-ignore-systemd-session-slice.conf when absent.'
        - 'Insert the configured systemd session-slice filtering rules.'
        - 'Run: systemctl restart rsyslog'
    cron:
      candidates:
        - etc/crontab
      required_path: etc/crontab
      expected_setting:
        key: MAILTO
        value: ''
      remediation:
        - 'Change MAILTO="root" to MAILTO="" in /etc/crontab.'
    normalized_fields:
      - rsyslog_filter_file_present
      - rsyslog_filter_content_matches
      - cron_mailto
    notes:
      - 'Only rsyslog and cron are active subchecks for SYS_OTHER_SETTINGS.'

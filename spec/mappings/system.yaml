system:
  hostname:
    candidates:
      - sos_commands/host/hostname
      - hostname

  os_release:
    candidates:
      - etc/redhat-release
      - etc/os-release
      - sos_commands/kernel/uname_-a

  hardware:
    candidates:
      - sos_commands/hardware/dmidecode
      - sos_commands/processor/lscpu
      - sos_commands/pci/lspci_-nnvv

  boot_mode:
    candidates:
      - sos_commands/boot/efibootmgr_-v
      - sos_commands/boot/ls_-lanR_.sys.firmware
      - sos_commands/boot/ls_-alZR_.sys.firmware
    secure_boot_candidates:
      - sos_commands/boot/mokutil_--sb-state

  filesystem:
    candidates:
      - sos_commands/filesys/findmnt
      - sos_commands/block/lsblk_-f_-a_-l
      - sos_commands/filesys/df_-ali_-x_autofs
      - sos_commands/filesys/df_-aliT_-x_autofs
      - sos_commands/filesys/df_-al_-x_autofs
      - etc/fstab
    lvm_candidates:
      - sos_commands/lvm2/pvs*
      - sos_commands/lvm2/vgs*
      - sos_commands/lvm2/lvs*
    swap_candidates:
      - proc/swaps
      - sos_commands/memory/swapon_--show*

  packages:
    candidates:
      - installed-rpms
      - sos_commands/dnf/dnf_list_installed
      - sos_commands/dnf/dnf_--assumeno_list_installed_dnf
    updateinfo_optional:
      - sos_commands/dnf/dnf_updateinfo*
      - sos_commands/yum/yum_updateinfo*

  selinux:
    candidates:
      - sos_commands/selinux/sestatus
      - sos_commands/selinux/getenforce
      - etc/selinux/config

  firewalld:
    candidates:
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units
      - sos_commands/firewalld/firewall-cmd_--list-all-zones
      - etc/firewalld/*

  time_sync:
    candidates:
      - sos_commands/chrony/chronyc_-n_sources
      - sos_commands/chrony/chronyc_tracking
      - sos_commands/chrony/chronyc_sourcestats
      - etc/chrony.conf
      - sos_commands/systemd/timedatectl

  kdump:
    candidates:
      - proc/cmdline
      - sys/kernel/kexec_crash_size
      - etc/kdump.conf
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units
      - sos_commands/kernel/sysctl_-a
    optional_candidates:
      - sos_commands/kdump/kdumpctl_status
      - sos_commands/kdump/kdumpctl_estimate
      - var/crash/*

  error_log:
    candidates:
      - var/log/messages
      - var/log/messages-*
      - sos_commands/kernel/dmesg
      - sos_commands/kernel/dmesg_*
      - sos_commands/logs/dmesg
      - sos_commands/logs/dmesg_*
      - sos_commands/logs/journalctl*
    search_profiles:
      storage_io:
        patterns:
          - 'blk_update_request: I/O error'
          - 'rejecting I/O to offline device'
          - 'killing request'
          - 'hostbyte=DID_NO_CONNECT'
          - 'mark as failed'
          - 'remaining active paths'
          - 'parity'
          - 'Abort command issued'
          - 'Hardware Error'
      generic_severity:
        word_patterns:
          - error
          - emerg
          - alert
          - aleart
          - crit
          - err
          - warn
          - fail
    normalized_fields:
      - source
      - timestamp
      - category
      - severity
      - component
      - matched_pattern
      - message
      - count
    notes:
      - 'Equivalent intent to the scope egrep keyword scan; implement in Python rather than shelling out.'
      - 'Generic words such as error/warn/fail require contextual filtering to reduce false positives.'
      - 'Finding a keyword is evidence for conditional assessment, not an automatic C grade.'

  kernel_parameters:
    candidates:
      - sos_commands/kernel/sysctl_-a
      - proc/sys/*

  boot_parameters:
    candidates:
      - proc/cmdline
      - etc/default/grub
      - boot/grub2/grub.cfg
      - boot/efi/EFI/*/grub.cfg
    normalized_fields:
      - runtime_cmdline_tokens
      - persistent_grub_tokens
      - token_value_map
      - runtime_vs_persistent_diff
    notes:
      - 'The current Scope lists Boot Parameters as a report item but does not provide an explicit detailed token/grade policy in the corresponding body section.'
      - 'Collect and compare runtime /proc/cmdline with persistent GRUB configuration, but keep A/B/C token policy as pending_policy until explicitly defined.'

  services:
    candidates:
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units
      - etc/systemd/system/*.wants/*

  app_coredump:
    candidates:
      - etc/security/limits.conf
      - etc/security/limits.d/*
      - etc/systemd/coredump.conf
      - etc/systemd/coredump.conf.d/*
      - etc/systemd/system.conf
      - usr/lib/sysctl.d/50-coredump.conf
      - proc/sys/kernel/core_pattern
      - usr/lib/tmpfiles.d/systemd.conf
      - etc/tmpfiles.d/*
    normalized_fields:
      - soft_core_limit
      - hard_core_limit
      - default_limit_core
      - core_pattern
      - coredump_storage
      - coredump_directory
      - tmpfiles_retention
      - tmpfiles_exclusion
    expected_checks:
      - path: etc/systemd/system.conf
        key: DefaultLimitCORE
        recommended: infinity
      - path: usr/lib/tmpfiles.d/systemd.conf
        key: /var/lib/systemd/coredump retention
        recommended_review: '3d default; consider exclusion or longer retention such as 15d according to policy'

  logrotate_sysstat:
    logrotate_candidates:
      - etc/logrotate.conf
      - etc/logrotate.d/*
      - sos_commands/logrotate/logrotate_debug
      - var/lib/logrotate/logrotate.status
    sysstat_candidates:
      - usr/lib/systemd/system/sysstat-collect.timer
      - etc/systemd/system/sysstat.service.wants/sysstat-collect.timer
      - etc/systemd/system/sysstat-collect.timer.d/*
      - etc/cron.d/sysstat
      - sos_commands/systemd/systemctl_list-timers_--all
      - installed-rpms
    normalized_fields:
      - logrotate_frequency
      - logrotate_rotate_count
      - sysstat_installed
      - sysstat_timer_present
      - sysstat_timer_oncalendar
      - sysstat_timer_enabled
    expected_checks:
      - path: usr/lib/systemd/system/sysstat-collect.timer
        key: OnCalendar
        recommended: '*:00/1'
        scope_default_example: '*:00/10'

  tuned:
    candidates:
      - sos_commands/tuned/tuned-adm_active
      - sos_commands/tuned/tuned-adm_recommend
      - sos_commands/tuned/tuned-adm_verify
      - etc/tuned/active_profile
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units

  irqbalance:
    candidates:
      - etc/sysconfig/irqbalance
      - sos_commands/systemd/systemctl_list-unit-files
      - sos_commands/systemd/systemctl_list-units

  timers:
    candidates:
      - sos_commands/systemd/systemctl_list-timers_--all
      - usr/lib/systemd/system/*.timer
      - etc/systemd/system/timers.target.wants/*
    applicability:
      source: sos_commands/systemd/systemctl_list-timers_--all
      conditional_after_inventory: true
    normalized_fields:
      - timer_name
      - next_run
      - last_run
      - active
      - enabled
      - conditionally_relevant
    notes:
      - 'First inventory list-timers, then evaluate only timer units that have an explicit diagnostic rule.'
      - 'dnf-makecache.timer is a known scope rule candidate; other timers are not automatically findings.'

  other_settings:
    rsyslog:
      candidates:
        - etc/rsyslog.d/0-ignore-systemd-session-slice.conf
      required_path: etc/rsyslog.d/0-ignore-systemd-session-slice.conf
      expected_content_lines:
        - 'if $programname == "systemd" and ($msg contains "User Manager for UID" or $msg contains "user@" or $msg contains "run-user-" or $msg contains "user-runtime-dir@" or $msg contains "slice User Slice of UID" or $msg contains "User runtime directory /run/user/") then stop'
        - 'if ($programname == "systemd" and $procid != "1") and ($msg contains "slice User Application Slice" or $msg contains "Queued start job for default target Main User Target" or $msg contains "Mark boot as successful after the user" or $msg contains "Daily Cleanup of User''s Temporary Directories" or $msg contains "D-Bus User Message Bus Socket" or $msg contains "Create User''s Volatile Files and Directories" or $msg contains "Exit the Session" or $msg contains "Reached target" or $msg contains "Stopped target" or $msg contains "Startup finished in") then stop'
      remediation:
        - 'Create /etc/rsyslog.d/0-ignore-systemd-session-slice.conf when absent.'
        - 'Insert the configured systemd session-slice filtering rules.'
        - 'Run: systemctl restart rsyslog'
    cron:
      candidates:
        - etc/crontab
      required_path: etc/crontab
      expected_setting:
        key: MAILTO
        value: ''
      remediation:
        - 'Change MAILTO="root" to MAILTO="" in /etc/crontab.'
    normalized_fields:
      - rsyslog_filter_file_present
      - rsyslog_filter_content_matches
      - cron_mailto
    notes:
      - 'Only rsyslog and cron are active subchecks for SYS_OTHER_SETTINGS.'

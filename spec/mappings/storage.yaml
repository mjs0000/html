storage:
  multipath:
    candidates:
      - sos_commands/multipath/multipath_-ll
      - sos_commands/multipath/multipathd_show_config
      - etc/multipath.conf
      - etc/multipath/*
    context_candidates:
      - sos_commands/fibrechannel/*
      - sos_commands/devicemapper/*
      - sos_commands/block/lsblk_-O_-P
    normalized_fields:
      - applicable
      - driver_loaded
      - map_count
      - alias
      - wwid
      - vendor
      - model
      - path_count
      - active_paths
      - failed_paths
      - path_policy
      - features
    notes:
      - 'Only multipath clients are assessed.'
      - 'Collected plugin output alone does not mean Multipath is in use.'
      - 'Vendor-specific recommended settings remain an external/internal policy dependency.'

  block_devices:
    candidates:
      - sos_commands/block/lsblk*
      - sos_commands/filesys/lsblk*

  lvm:
    candidates:
      - sos_commands/lvm2/pvs*
      - sos_commands/lvm2/vgs*
      - sos_commands/lvm2/lvs*
